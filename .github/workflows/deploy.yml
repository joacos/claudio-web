name: Deploy to cPanel via FTP

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Frontend
        run: npm run build

      - name: Install Studio Dependencies
        run: npm install
        working-directory: ./studio

      - name: Build Sanity Studio
        run: npx sanity build ../dist/studio --yes
        working-directory: ./studio

      - name: Verify Studio Build
        run: |
          echo "=== Studio index.html contents ==="
          cat dist/studio/index.html
          echo ""
          echo "=== Checking asset paths ==="
          grep -o 'src="[^"]*"' dist/studio/index.html || true
          grep -o 'href="[^"]*"' dist/studio/index.html || true
          echo "=== Studio files ==="
          find dist/studio -type f | head -30

      - name: Deploy to cPanel (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
