name: Deploy to cPanel via FTP

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Frontend
        run: npm run build

      - name: Install Studio Dependencies
        run: npm install
        working-directory: ./studio

      - name: Build Sanity Studio
        run: npx sanity build ./dist --yes
        working-directory: ./studio

      - name: Fix Studio Asset Paths
        run: |
          echo "=== Before fix ==="
          head -5 studio/dist/index.html
          # Replace /static/ with /studio/static/ in index.html
          sed -i 's|"/static/|"/studio/static/|g' studio/dist/index.html
          sed -i 's|/static/favicon|/studio/static/favicon|g' studio/dist/index.html
          echo "=== After fix ==="
          head -5 studio/dist/index.html

      - name: Move Studio Build to Dist
        run: |
          mkdir -p dist/studio
          cp -r studio/dist/* dist/studio/
          echo "=== Final studio/index.html ==="
          cat dist/studio/index.html | head -3
          echo "=== Studio files ==="
          find dist/studio -type f | head -20

      - name: Deploy to cPanel (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
